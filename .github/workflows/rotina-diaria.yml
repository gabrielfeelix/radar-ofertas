name: Rotina diária

# Coleta os preços e roda a manutenção do banco, uma vez por dia.
#
# Por que aqui e não no pg_cron do Supabase:
#
#   1. As fontes divergem sobre o pg_cron estar disponível no plano
#      gratuito — ele depende de um processo de fundo, que é o tipo
#      de coisa que planos gratuitos costumam cortar. Depender disso
#      é descobrir o problema em produção.
#   2. Projeto gratuito do Supabase é PAUSADO depois de uma semana
#      sem atividade. Esta rotina, rodando todo dia, mantém o
#      projeto de pé sozinha.
#   3. Aqui o histórico de execução fica visível, com log e e-mail
#      quando falha. No pg_cron, falha silenciosa é o padrão.
#
# Quando o projeto for para o plano Pro, dá para mover isto para o
# pg_cron sem mudar nada do lado do banco: as duas rotas chamam as
# mesmas funções.
#
# ATENÇÃO: o GitHub desativa workflow agendado depois de 60 dias sem
# nenhum commit no repositório. Se o projeto ficar dois meses parado,
# a coleta para em silêncio e a série fica com um buraco. O painel
# mostra os anúncios parados justamente para isso aparecer.

on:
  schedule:
    # 09:00 UTC = 06:00 em São Paulo. Cedo o suficiente para a fila
    # estar pronta quando o operador acordar.
    - cron: "0 9 * * *"
  # Permite rodar à mão pelo site do GitHub, para testar.
  workflow_dispatch:

jobs:
  rotina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Descobre produtos novos no Mercado Livre
        # A descoberta pesada mora aqui, uma vez ao dia: varre 109 termos
        # de busca e as categorias de mais vendidos. A coleta horária
        # cuida de reler o preço do que isto encontrou.
        #
        # A base pequena era o gargalo da deteccao, não o algoritmo: a
        # queda é medida contra a NOSSA leitura anterior, e com 64
        # produtos de preço estável ela quase nunca acontecia.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          npm install --no-save @supabase/supabase-js
          node scripts/coleta-mercado-livre.mjs || echo "descoberta falhou, a coleta horária segue"

      - name: Coleta de preços
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CHAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEGREDO: ${{ secrets.COLETA_SEGREDO }}
        run: |
          set -euo pipefail
          resposta=$(curl --silent --show-error --fail-with-body \
            --max-time 600 \
            -X POST "$URL/functions/v1/coleta-diaria" \
            -H "Authorization: Bearer $CHAVE" \
            -H "x-coleta-segredo: $SEGREDO")
          echo "$resposta"
          echo "### Coleta" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$resposta" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Colheita de canais de terceiros
        # A colheita existia desde 28/07 e NÃO era chamada por workflow
        # nenhum: rodava quando alguém lembrava. Numa invocação em
        # 01/08 ela trouxe 35 anúncios novos e 2 cupons — catálogo que
        # simplesmente não entrava porque ninguém apertava o botão.
        #
        # Diária e não horária de propósito: ela lê páginas de canal e
        # escava histórico, que é trabalho pesado e de retorno lento.
        # O cupom, que é o que vale um dia só, entra de hora em hora
        # pelo `scripts/colhe-cupons.mjs`.
        #
        # `continue-on-error` porque canal de terceiro fora do ar não
        # pode derrubar a manutenção e a detecção que vêm depois.
        continue-on-error: true
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CHAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEGREDO: ${{ secrets.COLETA_SEGREDO }}
        run: |
          set -euo pipefail
          resposta=$(curl --silent --show-error --fail-with-body \
            --max-time 600 \
            -X POST "$URL/functions/v1/colheita-canais" \
            -H "Authorization: Bearer $CHAVE" \
            -H "x-coleta-segredo: $SEGREDO")
          echo "$resposta"
          echo "### Colheita" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$resposta" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Manutenção e detecção de ofertas
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CHAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # Expurgo, expiração, compactação e detecção — nesta ordem,
          # decidida no banco pela função manutencao_diaria.
          resposta=$(curl --silent --show-error --fail-with-body \
            --max-time 600 \
            -X POST "$URL/rest/v1/rpc/manutencao_diaria" \
            -H "apikey: $CHAVE" \
            -H "Authorization: Bearer $CHAVE" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "$resposta"
          echo "### Manutenção" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$resposta" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
