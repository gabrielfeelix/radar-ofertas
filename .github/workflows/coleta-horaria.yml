name: Coleta horária

# POR QUE DE HORA EM HORA, E NÃO UMA VEZ AO DIA
#
# Canal de oferta é operação de tempo real. O comprador entra no
# Telegram e vê promoção o dia inteiro; quem administra publica quando
# aparece, não de manhã. Coletar uma vez por dia perde tudo que cai à
# tarde — e "o que caiu agora" é justamente o que se publica.
#
# Isto NÃO polui a série histórica: `registra_preco` guarda um ponto
# por dia, o menor do dia. Rodar de hora em hora só torna esse ponto
# mais preciso, e é o que dá material para o gatilho de queda.
#
# A rotina diária continua existindo e faz outra coisa: manutenção,
# expurgo e detecção de oferta por série.

on:
  schedule:
    # De hora em hora, as 24 horas.
    #
    # Era 11–02 UTC (8h às 23h de São Paulo), com o motivo "fora disso
    # ninguém publica". A D-033 decidiu o contrário: o canal publica de
    # madrugada, um post a cada 90 minutos, porque o dono confirmou que
    # os concorrentes publicam nesse horário e ele mesmo vê.
    #
    # Enquanto a janela fosse 8h–23h, o `intervalo_madrugada_min` nunca
    # disparava: das 00h às 07h não havia execução nenhuma. O canal
    # ficava mudo desde as 23h por falta de execução, não por regra de
    # ritmo.
    #
    # Quem segura o volume continua sendo o intervalo, não o cron.
    - cron: "0 * * * *"
  workflow_dispatch:

# Duas execuções ao mesmo tempo brigariam pelo refresh token: o ML
# invalida o anterior a cada renovação, então a segunda derrubaria a
# primeira e o token gravado ficaria sendo o perdedor.
concurrency:
  group: coleta-mercado-livre
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instala o cliente do Supabase
        run: npm install --no-save @supabase/supabase-js

      - name: Coleta de preços do Mercado Livre
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          # Só preços: a descoberta varre 109 termos de busca e leva mais
          # de dez minutos, então ela roda uma vez ao dia, na rotina
          # diária. Aqui o que importa é RELER o preço do que já está no
          # banco — é daí que sai a queda, e é o que precisa acontecer de
          # hora em hora.
          ML_SO_PRECOS: "1"
          # Sem ML_REFRESH_TOKEN de propósito: ele vive em
          # `credencial_rotativa`, no banco. Aqui cada execução começa
          # de um clone limpo, então token em arquivo ou em secret
          # ficaria velho na primeira renovação e a execução seguinte
          # falharia calada, dizendo só que pulou a loja.
        run: node scripts/coleta-mercado-livre.mjs

      - name: Detecta ofertas
        # Sem este passo a coleta grava o preço novo e ninguém vira
        # oferta: o preço cai, o sistema vê, e a fila continua vazia.
        #
        # São DUAS detecções e a ordem importa. `detecta_quedas` mede
        # contra a nossa leitura anterior e é o sinal forte, então roda
        # primeiro e fica com o anúncio. `detecta_declarados` lê o "de"
        # que a loja declara, que é alegação de terceiro, e só pega o
        # que sobrou. Invertê-las trocaria medição por alegação.
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CHAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          echo "### Ofertas detectadas" >> "$GITHUB_STEP_SUMMARY"
          for funcao in detecta_quedas detecta_declarados; do
            resposta=$(curl --silent --show-error --fail-with-body --max-time 120 \
              -X POST "$URL/rest/v1/rpc/$funcao" \
              -H "apikey: $CHAVE" -H "Authorization: Bearer $CHAVE" \
              -H "Content-Type: application/json" -d '{}')
            echo "$funcao: $resposta"
            echo "- \`$funcao\` $resposta" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Colhe cupons dos canais
        # Vem antes da publicação porque o post de cupom lê o que este
        # passo gravou. E é barato: uma página por canal.
        #
        # A extração também existe em `colheita-canais`, que é Edge
        # Function e NÃO é disparada por nenhum workflow. Um cupom do
        # Mercado Livre vale um dia, então depender de alguém lembrar de
        # rodar a colheita à mão seria o mesmo que não colher.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # `pipefail` porque o `| tee` mascara o codigo de saida do
          # node: sem ele, o step passa como sucesso mesmo quando o
          # script morre. Foi assim que um TypeError no publicador ficou
          # invisivel em 01/08 — a unica pista era a trava presa no
          # banco. Falha silenciosa e exatamente o que a D-015 recusa.
          set -o pipefail
          node --experimental-strip-types \
               --disable-warning=ExperimentalWarning \
               --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
               scripts/colhe-cupons.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publica no Telegram
        # O laço fecha aqui. Não há aprovação humana no caminho (D-033):
        # quem aprova são as comportas de confiança, e quem controla o
        # volume é o intervalo do ritmo.
        #
        # O WhatsApp nunca sai daqui — regra 3.2, e é o que protege o
        # número do parceiro.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ML_MATT_TOOL: ${{ secrets.ML_MATT_TOOL }}
          # A Amazon monta o link sozinha: `tag` paga a comissão e
          # `ascsubtag` carrega o subid, sem sessão nem etiqueta. Sem
          # esta variável o anúncio da Amazon sai sem comissão.
          AFILIADO_AMAZON: ${{ secrets.AFILIADO_AMAZON }}
        run: |
          set -o pipefail
          node --experimental-strip-types \
               --disable-warning=ExperimentalWarning \
               --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
               scripts/publica-automatico.mjs | tee -a "$GITHUB_STEP_SUMMARY"
